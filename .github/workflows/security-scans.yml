# Upload this single file to .github/workflows/security-scans.yml.
# Manual scans only. Uses the official ZAP image's bundled Firefox browser.
name: Security Scans
run-name: Security reports v10 - HTTP and DOM - ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - scanner: semgrep
            label: SAST - Semgrep
            artifact: semgrep-sast-reports
          - scanner: zap
            label: DAST - ZAP HTTP and DOM
            artifact: owasp-zap-dast-reports
    env:
      SCANNER: ${{ matrix.scanner }}
      TARGET_URL: https://zoombreakoutautomator.graffuxxx.workers.dev
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare report directory
        run: |
          report_dir="$RUNNER_TEMP/security-reports/$SCANNER"
          mkdir -p "$report_dir"
          printf 'REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$report_dir/started-at.txt"

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install PDF tools
        run: python -m pip install 'reportlab==4.4.3' 'pypdf==6.0.0'

      - name: Install Semgrep
        if: matrix.scanner == 'semgrep'
        run: python -m pip install 'semgrep==1.177.0' 2>&1 | tee "$REPORT_DIR/install.log"

      - name: Run Semgrep once and save both original formats
        if: matrix.scanner == 'semgrep'
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 15m semgrep scan \
            --config p/javascript --config p/secrets --config p/owasp-top-ten \
            --metrics=off --strict --error \
            --exclude security-evidence --exclude tmp --exclude node_modules \
            --exclude legacy_autohotkey \
            --json-output "$REPORT_DIR/semgrep-report.json" \
            --sarif-output "$REPORT_DIR/semgrep-report.sarif" \
            . 2>&1 | tee "$REPORT_DIR/scan.log"
          scan_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$scan_exit" > "$REPORT_DIR/exit-code.txt"

      - name: Prepare official OWASP ZAP image
        if: matrix.scanner == 'zap'
        timeout-minutes: 5
        run: |
          chmod 777 "$REPORT_DIR"
          docker pull "$ZAP_IMAGE" 2>&1 | tee "$REPORT_DIR/install.log"
          docker image inspect "$ZAP_IMAGE" --format '{{json .RepoDigests}}' > "$REPORT_DIR/image-digest.txt"

      - name: Run OWASP ZAP active HTTP scan
        if: matrix.scanner == 'zap'
        timeout-minutes: 22
        run: |
          printf '# No disabled rules. DOM-XSS uses bundled Firefox headless.\n' > "$REPORT_DIR/zap-rules.tsv"
          python - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['REPORT_DIR'], 'completion-hook.py').write_text('''import json
          import shutil
          from pathlib import Path

          def zap_started(zap, target):
              for path in ('/privacy.html', '/terms.html', '/support.html', '/documentation.html'):
                  zap.urlopen(target.rstrip('/') + path)

          def zap_pre_shutdown(zap):
              scans = zap.ascan.scans
              payload = {
                  'scan': scans[-1] if scans else {},
                  'rules': zap.ascan.scan_progress(scans[-1]['id']) if scans else [],
                  'policy': zap.ascan.scanners('Default Policy'),
              }
              Path('/zap/wrk/active-progress.json').write_text(json.dumps(payload, indent=2))
              shutil.copyfile('/home/zap/.ZAP/zap.log', '/zap/wrk/zap.log')
          ''')
          PY
          # Native full scan: spider, active HTTP attacks, passive checks, native reports.
          # Explicitly seed unlinked public pages; do not truncate individual rules.
          set +e
          timeout --signal=TERM --kill-after=30s 20m \
            docker run --rm --shm-size=2g --name "zap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -e PYTHONUNBUFFERED=1 -v "$REPORT_DIR:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-full-scan.py -t "$TARGET_URL/" -m 2 -T 5 \
            -c zap-rules.tsv --hook=/zap/wrk/completion-hook.py \
            -z "-config scanner.maxRuleDurationInMins=0 -config rules.domxss.browserid=firefox-headless" \
            -J zap-report.json -w zap-report.md -r zap-report.html \
            2>&1 | tee "$REPORT_DIR/scan.log"
          scan_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$scan_exit" > "$REPORT_DIR/exit-code.txt"
          docker rm -f "zap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true

      - name: Validate original reports and create uploadable PDF
        id: report
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          folder = Path(os.environ['REPORT_DIR'])
          folder.mkdir(parents=True, exist_ok=True)
          scanner = os.environ['SCANNER']
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])
          output_path = Path(os.environ['GITHUB_OUTPUT'])
          title = 'SAST - Semgrep' if scanner == 'semgrep' else 'DAST - ZAP HTTP and DOM-XSS'
          run_url = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                     f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}")
          problems, details, coverage = [], [], []

          def required(name):
              path = folder / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise ValueError(f'Missing or empty scanner output: {name}')
              return path

          def plain(value):
              return html.unescape(re.sub(r'<[^>]+>', ' ', str(value)))

          def record(label, value):
              details.append((label, str(value)))

          try:
              code = int(required('exit-code.txt').read_text().strip())
              log = required('scan.log').read_text(errors='replace')
              if scanner == 'semgrep':
                  data = json.loads(required('semgrep-report.json').read_text())
                  sarif = json.loads(required('semgrep-report.sarif').read_text())
                  findings = data['results']
                  errors = data['errors']
                  coverage = data['paths']['scanned']
                  assert isinstance(findings, list) and isinstance(errors, list)
                  assert isinstance(coverage, list) and coverage, 'No source files were scanned'
                  scanned = {p.removeprefix('./') for p in coverage}
                  assert {'app.js', 'src/worker.js', 'zoom-apps-sdk-0.16.41.min.js'} <= scanned, 'Application source or shipped SDK missing from scan coverage'
                  runs = sarif['runs']
                  assert runs and sarif['version'] == '2.1.0', 'Invalid SARIF report'
                  rules = runs[0]['tool']['driver']['rules']
                  assert rules, 'No rules recorded in SARIF'
                  assert len(runs[0]['results']) == len(findings), 'JSON/SARIF finding counts differ'
                  version = data['version']
                  if code not in (0, 1):
                      problems.append(f'Scanner execution failed: exit code {code}')
                  problems.extend(json.dumps(e, ensure_ascii=True) for e in errors)
                  scope = ('Repository source; rulesets: p/javascript, p/secrets, p/owasp-top-ten. '
                           'Excludes generated security-evidence, tmp, node_modules and retired legacy_autohotkey. '
                           'Community Edition analysis; not a dependency audit or third-party penetration test.')
                  counts = Counter(str(f['extra']['severity']) for f in findings)
                  gate = 1 if findings or code == 1 else 0
                  record('Rules in original SARIF', len(rules))
                  for finding in findings:
                      record('Finding', finding['check_id'])
                      record('Severity', finding['extra']['severity'])
                      record('Location', f"{finding['path']}:{finding['start']['line']}")
                      record('Message', finding['extra']['message'])
                  originals = ['semgrep-report.json', 'semgrep-report.sarif']
              else:
                  data = json.loads(required('zap-report.json').read_text())
                  required('zap-report.html')
                  required('zap-report.md')
                  daemon_log = required('zap.log').read_text(errors='replace')
                  skipped = [line for line in daemon_log.splitlines()
                             if any(term in line.lower() for term in ('skipped plugin', 'time limit', 'timed out', 'maximum duration'))]
                  for line in skipped:
                      record('Skipped check / coverage limitation', line)
                      if any(term in line.lower() for term in ('exceeded max rule time', 'time limit', 'timed out', 'maximum duration', 'browser error')):
                          problems.append('Active check incomplete: ' + line)
                  if 'Skipping scanner, failed to start browser' in daemon_log:
                      problems.append('DOM XSS coverage incomplete: the scanner browser failed to start.')
                  if 'completed host/plugin' not in daemon_log:
                      problems.append('No completed active checks recorded in ZAP daemon log.')
                  progress = json.loads(required('active-progress.json').read_text())
                  active = progress['scan']
                  if active.get('state') != 'FINISHED' or str(active.get('progress')) != '100':
                      problems.append('Active scan did not finish: ' + json.dumps(active))
                  if int(active.get('reqCount', 0)) <= 0:
                      problems.append('No active test requests were recorded.')
                  plugins = [entry['Plugin'] for host_progress in progress.get('rules', [])
                             if isinstance(host_progress, dict)
                             for entry in host_progress.get('HostProcess', []) if 'Plugin' in entry]
                  dom = [rule for rule in progress['policy'] if str(rule['id']) == '40026']
                  if len(dom) != 1 or dom[0].get('alertThreshold') == 'OFF':
                      problems.append('DOM-XSS was not enabled in the executed scan policy.')
                  if not any(len(p) >= 7 and str(p[1]) == '40026' and p[3] == 'Complete'
                             and int(p[5]) > 0 for p in plugins):
                      problems.append('DOM-XSS browser rule did not complete with test requests.')
                  if not any(len(p) >= 7 and str(p[1]) != '40026' and p[3] == 'Complete'
                             and int(p[5]) > 0 for p in plugins):
                      problems.append('No completed HTTP active rule with test requests recorded.')
                  record('Browser test', 'DOM-XSS rule 40026 enabled with Firefox headless; completion checked below.')
                  record('Actual active policy', json.dumps(progress['policy']))
                  record('Active scan completion', json.dumps(active))
                  for plugin in plugins:
                      record('Active rule execution', json.dumps(plugin))
                  sites = data['site']
                  assert isinstance(sites, list) and sites, 'No scanned site in ZAP report'
                  host = urlsplit(os.environ['TARGET_URL']).hostname
                  matching = [s for s in sites if urlsplit(s['@name']).hostname == host]
                  assert matching, 'ZAP report does not contain the configured target'
                  totals = re.search(r'Total of (\d+) URLs', log)
                  assert totals and int(totals.group(1)) > 0, 'No crawled URL count recorded'
                  assert 'FAIL-NEW:' in log and 'PASS:' in log, 'ZAP did not reach its final scan summary'
                  findings = [a for s in sites for a in s['alerts']]
                  version = data['@version']
                  if code not in (0, 1, 2):
                      problems.append(f'Scanner execution failed: exit code {code}')
                  if code == 2 and not findings:
                      problems.append('ZAP reported warnings but its JSON contains no alerts')
                  scope = (f"Unauthenticated active HTTP scan of {os.environ['TARGET_URL']}/. "
                           'Includes DOM-XSS browser rule 40026 using Firefox headless. '
                           'No AJAX/client spider. Traditional spider limited to 2 minutes; public documentation pages explicitly seeded, then active and passive checks. '
                           'No per-rule time limit. A 20-minute outer timeout marks the run incomplete if exceeded. '
                           'OAST tests without an external callback service and custom-script checks may be skipped; see execution details. '
                           'Zoom client workflows, authenticated sessions and Zoom API endpoints are not tested. '
                           'The repository commit identifies this workflow, not necessarily the deployed website version.')
                  levels = {'0': 'Informational', '1': 'Low', '2': 'Medium', '3': 'High'}
                  counts = Counter(levels[str(a['riskcode'])] for a in findings)
                  gate = 1 if code == 1 or any(int(a['riskcode']) >= 2 for a in findings) else 0
                  record('URLs observed by ZAP', totals.group(1))
                  record('Container image digest', required('image-digest.txt').read_text().strip())
                  coverage = [s['@name'] for s in sites]
                  for alert in findings:
                      record('Finding', f"{alert['pluginid']}: {alert['name']}")
                      record('Severity / confidence', alert['riskdesc'])
                      record('Description', plain(alert.get('desc', '')))
                      record('Remediation', plain(alert.get('solution', '')))
                      record('References', plain(alert.get('reference', '')))
                      for instance in alert.get('instances', []):
                          record('Affected endpoint', f"{instance.get('method', '')} {instance.get('uri', '')}")
                          for field in ('param', 'attack', 'evidence', 'otherinfo'):
                              if instance.get(field):
                                  record(field, plain(instance[field]))
                  originals = ['zap-report.json', 'zap-report.html', 'zap-report.md']
                  originals += ['active-progress.json', 'zap.log', 'zap-rules.tsv']

              if problems:
                  status = 'INCOMPLETE - scanner errors require investigation'
                  gate = 2
              elif findings or gate:
                  status = 'COMPLETED WITH FINDINGS - review required'
              else:
                  status = 'COMPLETED - no findings reported within scan scope'
              count_text = ', '.join(f'{key}: {value}' for key, value in sorted(counts.items())) or '0'
              metadata = [
                  ('Application', 'Zoom Breakout Automator'),
                  ('Status', status), ('Scanner', f'{title}; version {version}'),
                  ('Started (UTC)', required('started-at.txt').read_text().strip()),
                  ('Report generated (UTC)', datetime.now(timezone.utc).isoformat()),
                  ('Repository', os.environ['GITHUB_REPOSITORY']),
                  ('Workflow/source commit', os.environ['GITHUB_SHA']),
                  ('GitHub run', run_url), ('Scanner exit code', code),
                  ('Findings by scanner severity', count_text), ('Scope and limitations', scope),
                  ('Evidence', 'Readable rendering of original scanner results. Unmodified original reports '
                   'are embedded as PDF attachments and included in the download. This is not a security certification.'),
              ]
              from reportlab.lib import colors
              from reportlab.lib.styles import getSampleStyleSheet
              from reportlab.lib.enums import TA_LEFT
              from reportlab.lib.pagesizes import A4
              from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer
              from pypdf import PdfReader, PdfWriter

              styles = getSampleStyleSheet()
              styles['Heading3'].keepWithNext = True
              styles['BodyText'].fontSize = 9
              styles['BodyText'].leading = 13
              styles['BodyText'].wordWrap = 'CJK'
              styles['BodyText'].alignment = TA_LEFT
              story = [Paragraph('Zoom Breakout Automator', styles['Title']),
                       Paragraph(title, styles['Heading1'])]

              def paragraph(label, value):
                  story.append(Paragraph(html.escape(str(label)), styles['Heading3']))
                  # Bounded paragraphs can split across pages even for long scanner messages.
                  text = str(value)
                  for offset in range(0, max(len(text), 1), 1600):
                      story.append(Paragraph(html.escape(text[offset:offset + 1600]).replace('\n', '<br/>'),
                                             styles['BodyText']))
                  story.append(Spacer(1, 4))

              for label, value in metadata + details:
                  paragraph(label, value)
              paragraph('Scanner errors', '\n'.join(problems) or 'None reported')
              paragraph('Scanned files / sites', '\n'.join(coverage))
              for name in originals:
                  paragraph('Original report SHA-256', f'{name}: {hashlib.sha256(required(name).read_bytes()).hexdigest()}')

              def footer(canvas, doc):
                  canvas.setFont('Helvetica', 8)
                  canvas.setFillColor(colors.HexColor('#555555'))
                  canvas.drawString(42, 25, title)
                  canvas.drawRightString(A4[0] - 42, 25, f'Page {doc.page}')

              draft = folder / 'report-draft.pdf'
              SimpleDocTemplate(str(draft), pagesize=A4, leftMargin=42, rightMargin=42,
                                topMargin=36, bottomMargin=42).build(story, onFirstPage=footer, onLaterPages=footer)
              pdf = folder / f'{scanner}-report.pdf'
              writer = PdfWriter(clone_from=str(draft))
              for name in originals:
                  writer.add_attachment(name, required(name).read_bytes())
              with pdf.open('wb') as stream:
                  writer.write(stream)
              assert len(PdfReader(pdf).pages) > 0, 'PDF is empty'
              draft.unlink()
              summary = (f'## {title}\n\n**{status}**\n\n'
                         f'- Findings: {count_text}\n- Scanner exit code: {code}\n'
                         f'- PDF for upload: `{pdf.name}`\n- Run: {run_url}\n\n'
                         f'**Scope and limitations:** {scope}\n\n'
                         'Original scanner reports and scan.log are included in the artifact. '
                         'A completed scan does not imply that all findings are resolved.\n')
              if problems:
                  summary += '\nScanner errors:\n\n' + '\n'.join(f'- {p}' for p in problems) + '\n'
              (folder / 'summary.md').write_text(summary)
              (folder / 'scan-status.json').write_text(json.dumps({
                  'status': status, 'gate': gate, 'counts': dict(counts), 'problems': problems,
                  'run': run_url, 'commit': os.environ['GITHUB_SHA'], 'scanner': title,
              }, indent=2))
              (folder / 'validation-exit.txt').write_text(str(gate))
              with summary_path.open('a') as stream:
                  stream.write(summary)
              with output_path.open('a') as stream:
                  stream.write(f"report_ready={'true' if gate != 2 else 'false'}\n")
          except Exception as exc:
              message = f'{type(exc).__name__}: {exc}'
              (folder / 'REPORT-FAILED.txt').write_text(
                  'NO VALIDATED SCAN REPORT - do not submit this as completed scan evidence.\n'
                  + message + '\nInspect scan.log / install.log and the failed GitHub step.\n')
              (folder / 'validation-exit.txt').write_text('2')
              with summary_path.open('a') as stream:
                  stream.write(f'## {title}\n\n**REPORT FAILED**\n\n{message}\n\n'
                               'Download the diagnostics artifact for logs. No completed scan evidence was produced.\n')
              print(f'::error::Report validation failed: {message}')
              raise
          PY

      - name: Upload verified reports or failure diagnostics
        id: upload
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}${{ steps.report.outputs.report_ready != 'true' && '-FAILED-diagnostics' || '' }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Show download link
        if: always() && steps.upload.outputs.artifact-url != ''
        env:
          DOWNLOAD_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '\n[Download reports / diagnostics](%s)\n' "$DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Set final scan status after uploading evidence
        if: always()
        run: |
          test -s "$REPORT_DIR/validation-exit.txt" || exit 1
          result=$(cat "$REPORT_DIR/validation-exit.txt")
          if [ "$result" = 2 ]; then
            echo '::error::Scan/report incomplete. Read REPORT-FAILED.txt or the scanner errors in the summary. No completed evidence is claimed.'
            exit 1
          fi
          case "$result" in
            0) echo 'Scan complete. Check the summary for any low/informational ZAP alerts.' ;;
            1) echo '::error::Scan complete; security findings require review. Reports have been preserved.'; exit 1 ;;
            *) echo '::error::Scan/report incomplete. Download the diagnostics and inspect failed steps.'; exit 1 ;;
          esac
